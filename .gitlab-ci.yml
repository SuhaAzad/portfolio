stages:
  - deploy

deploy:
  stage: deploy

  # Use Google Cloud SDK image (NO manual install needed)
  image: google/cloud-sdk:slim

  services:
    - docker:dind

  variables:
    PROJECT_ID: $GCP_PROJECT_ID
    REGION: asia-south1
    REPO: portfolio-repo
    IMAGE: portfolio

  before_script:
  - echo "DEBUG PROJECT_ID=$GCP_PROJECT_ID"
  - if [ -z "$GCP_PROJECT_ID" ]; then echo "MISSING VARIABLE"; exit 1; fi
  script:
    # Build Docker image
    - docker build -t $REGION-docker.pkg.dev/$PROJECT_ID/$REPO/$IMAGE:$CI_COMMIT_SHA .

    # Push image
    - docker push $REGION-docker.pkg.dev/$PROJECT_ID/$REPO/$IMAGE:$CI_COMMIT_SHA

    # Deploy to Cloud Run
    - |
      gcloud run deploy portfolio-app \
        --image $REGION-docker.pkg.dev/$PROJECT_ID/$REPO/$IMAGE:$CI_COMMIT_SHA \
        --region $REGION \
        --platform managed \
        --allow-unauthenticated