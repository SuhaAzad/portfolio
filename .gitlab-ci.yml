stages:
  - deploy

deploy:
  stage: deploy

  # Use Google Cloud SDK image (NO manual install needed)
  image: google/cloud-sdk:slim

  services:
    - docker:dind

  variables:
    PROJECT_ID: $GCP_PROJECT_ID
    REGION: asia-south1
    REPO: portfolio-repo
    IMAGE: portfolio

  before_script:
    # Authenticate project
    - echo "Setting GCP project..."
    - gcloud config set project $PROJECT_ID

    # Configure Docker for Artifact Registry
    - gcloud auth configure-docker $REGION-docker.pkg.dev -q

  script:
    # Build Docker image
    - docker build -t $REGION-docker.pkg.dev/$PROJECT_ID/$REPO/$IMAGE:$CI_COMMIT_SHA .

    # Push image
    - docker push $REGION-docker.pkg.dev/$PROJECT_ID/$REPO/$IMAGE:$CI_COMMIT_SHA

    # Deploy to Cloud Run
    - |
      gcloud run deploy portfolio-app \
        --image $REGION-docker.pkg.dev/$PROJECT_ID/$REPO/$IMAGE:$CI_COMMIT_SHA \
        --region $REGION \
        --platform managed \
        --allow-unauthenticated